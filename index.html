<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UniSync Course Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Add Course Form -->
<form id="addCourseForm" style="margin-bottom: 20px; display: flex; gap: 10px;">
  <input 
    type="text" 
    id="newCourseInput" 
    placeholder="Enter course code (e.g. CSE1001)..." 
    style="padding: 8px; width: 70%;"
  >
  <button type="submit" style="padding: 8px 16px;">Add Course</button>
</form>
<p id="errorMessage" style="color: red; margin-top: -10px; font-size: 14px;"></p>
<!-- Offline Notification Banner -->
  <div id="offlineBanner" style="display: none; background-color: #e74c3c; color: white; padding: 10px; text-align: center; border-radius: 6px; margin-bottom: 15px; width: 100%; max-width: 600px; font-size: 14px; font-weight: 500; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    ⚠️ You are offline. Showing cached courses.
  </div>

  <div class="controls">
    <!-- Live Search Input -->
    <input type="text" id="searchInput" placeholder="Search course code...">

    <!-- Sort Dropdown -->
    <select id="sortSelect">
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
      <option value="az">Code (A–Z)</option>
      <option value="za">Code (Z–A)</option>
    </select>
  </div>

  

  <!-- Container where courses render -->
  <div id="courseList"></div>
  

  <!-- LINK YOUR SCRIPT HERE AT THE BOTTOM -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
